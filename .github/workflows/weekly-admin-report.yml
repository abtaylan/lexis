name: Lexis - weekly admin report

on:
  schedule:
    # Pazartesi 09:00 Turkiye saati (UTC+3, DST yok) civari, 10 dakikada bir
    # 6 deneme (06:00-06:50 UTC Pazartesi) -- daily-word-email.yml /
    # notify-membership-changes.yml ile ayni gerekce: GitHub Actions'in
    # haftada tek bir sabit dakikadaki cron tick'i bazen sessizce hic
    # calismayabiliyor, backend tarafinda already_ran_today (gunluk
    # takvim gunu bazinda) ile haftada tek gonderim garantisi var.
    - cron: '5,15,25,35,45,55 6 * * 1'
  workflow_dispatch: {}

jobs:
  trigger-weekly-admin-report:
    runs-on: ubuntu-latest
    steps:
      - name: POST /internal/cron/weekly-admin-report
        run: |
          set -e
          http_code=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -X POST "${{ secrets.LEXIS_BACKEND_URL }}/internal/cron/weekly-admin-report" \
            -H "X-Cron-Secret: ${{ secrets.LEXIS_CRON_SECRET }}")
          echo "HTTP $http_code"
          cat /tmp/response.json
          if [ "$http_code" -ge 300 ]; then
            echo "Istek basarisiz (HTTP $http_code)"
            exit 1
          fi
