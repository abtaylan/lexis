name: EAS OTA Update (production)

# Sadece JS/TS/asset degisikligi olan push'larda otomatik OTA update
# gonderir -- native kod/bagimlilik degisikligi (app.json, package.json,
# ios/android klasorleri) icin bu YETERLI DEGIL, ayri bir
# eas-build-submit.yml calistirmasi (bkz. o dosya) gerekiyor, aksi
# halde runtimeVersion uyusmazligindan cihazlar guncellemeyi hic almaz
# (bkz. LEXIS_DEVIR_2026-09-10.md "10 Eylul 2026" notu -- iOS STORE
# build #10 ile Android'deki tek production build ayni runtime'da
# degildi).
on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - "!mobile/app.json"
      - "!mobile/package.json"
      - "!mobile/package-lock.json"
      - "!mobile/android/**"
      - "!mobile/ios/**"
  # Elle tetikleme: otomatik path filtresine takilmayan durumlarda (ornegin
  # bu workflow dosyasinin kendisi degisti, ya da onceki bir otomatik run
  # basarisiz oldu ve mobile/** icin yeni bir push beklemeden hemen tekrar
  # yayinlanmasi gerekiyor) OTA'yi elden calistirmak icin.
  workflow_dispatch:

jobs:
  update:
    name: Publish OTA update
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      # 24 Eylul 2026 -- KOK NEDEN BULUNDU: commit mesaji COK SATIRLI oldugunda
      # (bu repoda artik norm -- detayli gerekce + zorunlu Co-Authored-By/
      # Claude-Session trailer'lari) asagidaki $ {{ github.event.head_commit.
      # message }} run: script'inin ICINE DOGRUDAN metin olarak gomuluyordu.
      # "eas update" CLI'i (yargs tabanli) --message degerindeki gomulu
      # satir sonlarini "beklenmeyen argumanlar" olarak yorumlayip HER SEFERINDE
      # patliyordu -- run #31/#32/#33 (son 3 mobile/** push'u -- Madde 2, Madde 3,
      # CEFR rozeti) SESSIZCE basarisiz olmustu, kullanici GitHub e-postasiyla
      # fark etti. Ayrica bu desen (kullanici kontrolundeki -- burada commit
      # mesaji -- serbest metni dogrudan run: script'ine gommek) genel olarak
      # shell injection riski tasir; GitHub'in onerdigi guvenli desen, degeri
      # once bir env degiskenine atayip scriptte $VAR olarak kullanmak (YAML
      # duzeyinde substitude edilse de env atamasi shell script metnine
      # KARISMIYOR, ayri bir mekanizma). Commit mesajinin SADECE ilk satiri
      # (baslik) update etiketi icin zaten yeterli/istenen -- `head -n1` ile
      # aliniyor, bu da coklu-satir sorununu kaynagindan cozuyor.
      - name: Publish EAS update (iOS)
        # ios ve android AYRI CAGRILAR olarak calistiriliyor -- "eas update"
        # (eas build'in aksine) --platform bayraginda virgulle ayrilmis liste
        # KABUL ETMIYOR ("Expected --platform=ios,android to be one of:
        # android, ios, all", run #10). Tek secenek olan "all" ise mobil
        # projede app.json'daki web.output:"static" ayari yuzunden web icin
        # de JS export almaya calisiyor -- bu proje web'e HIC deploy
        # edilmiyor (web'i ayri Next.js projesi sagliyor), ama web bundling
        # yine de tetikleniyor ve react-native-google-mobile-ads
        # (AdBanner.tsx) native-only bir RN internal modulunu
        # (codegenNativeComponent) web'de import etmeye calistigi icin
        # export sert bir sekilde patliyor (run #9: "Web Bundling failed
        # ... Importing native-only module ... on web"). Bu yuzden web'i
        # tamamen atlamanin tek yolu ios ve android'i AYRI AYRI, "all"
        # kullanmadan yayinlamak.
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          FIRST_LINE=$(printf '%s' "$COMMIT_MSG" | head -n1)
          eas update --branch production --platform ios --message "CI: $FIRST_LINE" --non-interactive

      - name: Publish EAS update (Android)
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          FIRST_LINE=$(printf '%s' "$COMMIT_MSG" | head -n1)
          eas update --branch production --platform android --message "CI: $FIRST_LINE" --non-interactive
