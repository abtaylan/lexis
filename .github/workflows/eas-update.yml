name: EAS OTA Update (production)

# Sadece JS/TS/asset degisikligi olan push'larda otomatik OTA update
# gonderir -- native kod/bagimlilik degisikligi (app.json, package.json,
# ios/android klasorleri) icin bu YETERLI DEGIL, ayri bir
# eas-build-submit.yml calistirmasi (bkz. o dosya) gerekiyor, aksi
# halde runtimeVersion uyusmazligindan cihazlar guncellemeyi hic almaz
# (bkz. LEXIS_DEVIR_2026-09-10.md "10 Eylul 2026" notu -- iOS STORE
# build #10 ile Android'deki tek production build ayni runtime'da
# degildi).
on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - "!mobile/app.json"
      - "!mobile/package.json"
      - "!mobile/package-lock.json"
      - "!mobile/android/**"
      - "!mobile/ios/**"
  # Elle tetikleme: otomatik path filtresine takilmayan durumlarda (ornegin
  # bu workflow dosyasinin kendisi degisti, ya da onceki bir otomatik run
  # basarisiz oldu ve mobile/** icin yeni bir push beklemeden hemen tekrar
  # yayinlanmasi gerekiyor) OTA'yi elden calistirmak icin.
  workflow_dispatch:

jobs:
  update:
    name: Publish OTA update
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      - name: Publish EAS update
        # --platform ios,android: mobil projede app.json'daki web.output:"static"
        # ayari yuzunden "eas update" varsayilan olarak (platform belirtilmezse
        # "all") web icin de JS bundle almaya calisiyor. Bu proje web'e HIC
        # deploy edilmiyor (monorepo'daki ayri "web" Next.js projesi web'i
        # kendisi sagliyor) -- ama web bundling yine de calisiyor ve
        # react-native-google-mobile-ads (AdBanner.tsx) native-only bir RN
        # internal modulunu (codegenNativeComponent) web'de import etmeye
        # calistigi icin export sert bir sekilde patliyor (11 Eylul 2026,
        # run #9: "Web Bundling failed ... Importing native-only module
        # ... on web"). ios/android bundle'lari sorunsuz basariyla
        # tamamlaniyor; hatanin tek sebebi gereksiz web adimi. Bu satirla
        # web adimi tamamen atlanip sorun kokten cozuluyor.
        run: |
          eas update --branch production --platform ios,android --message "CI: ${{ github.event.head_commit.message }}" --non-interactive
