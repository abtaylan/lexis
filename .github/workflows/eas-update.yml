name: EAS OTA Update (production)

# Sadece JS/TS/asset degisikligi olan push'larda otomatik OTA update
# gonderir -- native kod/bagimlilik degisikligi (app.json, package.json,
# ios/android klasorleri) icin bu YETERLI DEGIL, ayri bir
# eas-build-submit.yml calistirmasi (bkz. o dosya) gerekiyor, aksi
# halde runtimeVersion uyusmazligindan cihazlar guncellemeyi hic almaz
# (bkz. LEXIS_DEVIR_2026-09-10.md "10 Eylul 2026" notu -- iOS STORE
# build #10 ile Android'deki tek production build ayni runtime'da
# degildi).
on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - "!mobile/app.json"
      - "!mobile/package.json"
      - "!mobile/package-lock.json"
      - "!mobile/android/**"
      - "!mobile/ios/**"
  # Elle tetikleme: otomatik path filtresine takilmayan durumlarda (ornegin
  # bu workflow dosyasinin kendisi degisti, ya da onceki bir otomatik run
  # basarisiz oldu ve mobile/** icin yeni bir push beklemeden hemen tekrar
  # yayinlanmasi gerekiyor) OTA'yi elden calistirmak icin.
  workflow_dispatch:

jobs:
  update:
    name: Publish OTA update
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      - name: Publish EAS update (iOS)
        # ios ve android AYRI CAGRILAR olarak calistiriliyor -- "eas update"
        # (eas build'in aksine) --platform bayraginda virgulle ayrilmis liste
        # KABUL ETMIYOR ("Expected --platform=ios,android to be one of:
        # android, ios, all", run #10). Tek secenek olan "all" ise mobil
        # projede app.json'daki web.output:"static" ayari yuzunden web icin
        # de JS export almaya calisiyor -- bu proje web'e HIC deploy
        # edilmiyor (web'i ayri Next.js projesi sagliyor), ama web bundling
        # yine de tetikleniyor ve react-native-google-mobile-ads
        # (AdBanner.tsx) native-only bir RN internal modulunu
        # (codegenNativeComponent) web'de import etmeye calistigi icin
        # export sert bir sekilde patliyor (run #9: "Web Bundling failed
        # ... Importing native-only module ... on web"). Bu yuzden web'i
        # tamamen atlamanin tek yolu ios ve android'i AYRI AYRI, "all"
        # kullanmadan yayinlamak.
        run: |
          eas update --branch production --platform ios --message "CI: ${{ github.event.head_commit.message }}" --non-interactive

      - name: Publish EAS update (Android)
        run: |
          eas update --branch production --platform android --message "CI: ${{ github.event.head_commit.message }}" --non-interactive
