name: Lexis - push reminders

on:
  schedule:
    # 09:00 ve 20:00 Türkiye saati (UTC+3, DST yok) civarı, her ikisi de 10
    # dakikada bir 6 deneme. NEDEN BÖYLE: bkz. daily-word-email.yml'deki
    # aynı yorum — GitHub Actions'ın günde 1-2 kez tetiklenen sabit dakikalı
    # cron'ları bazen SESSİZCE hiç çalıştırmadığı görüldü. Backend'de
    # already_ran_today idempotency kontrolü günde tek gönderim garantisi
    # veriyor (bkz. cron.py).
    - cron: '0,10,20,30,40,50 6 * * *'   # sabah penceresi
    - cron: '0,10,20,30,40,50 17 * * *'  # akşam penceresi
  workflow_dispatch:
    inputs:
      slot:
        description: 'morning veya evening (workflow_dispatch ile manuel tetiklerken)'
        required: true
        default: 'morning'

jobs:
  trigger-push-reminder:
    runs-on: ubuntu-latest
    steps:
      - name: Slot belirle (hangi saat penceresinde tetiklendi)
        id: slot
        run: |
          # KULLANICI GERİ BİLDİRİMİ ÜZERİNE GÜNCELLEME (7 Eylül 2026): artık
          # her pencerede birden fazla dakikada tetiklendiği için
          # github.event.schedule'ı tek bir sabit string ile karşılaştırmak
          # yerine (eskiden '0 6 * * *' gibi tam eşleşme aranıyordu, artık
          # '0,10,20,...' listesiyle eşleşmez) tetiklenen ANIN UTC saatine
          # bakıyoruz — 6. saatteyse sabah, 17. saatteyse akşam penceresi.
          if [ -n "${{ github.event.schedule }}" ]; then
            hour=$(date -u +%H)
            if [ "$hour" = "06" ]; then
              echo "slot=morning" >> "$GITHUB_OUTPUT"
            elif [ "$hour" = "17" ]; then
              echo "slot=evening" >> "$GITHUB_OUTPUT"
            else
              echo "Beklenmeyen saat: $hour (schedule=${{ github.event.schedule }})"
              exit 1
            fi
          else
            echo "slot=${{ github.event.inputs.slot }}" >> "$GITHUB_OUTPUT"
          fi

      - name: "POST /internal/cron/send-push-reminder-<slot>"
        run: |
          set -e
          http_code=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -X POST "${{ secrets.LEXIS_BACKEND_URL }}/internal/cron/send-push-reminder-${{ steps.slot.outputs.slot }}" \
            -H "X-Cron-Secret: ${{ secrets.LEXIS_CRON_SECRET }}")
          echo "HTTP $http_code"
          cat /tmp/response.json
          if [ "$http_code" -ge 300 ]; then
            echo "İstek başarısız (HTTP $http_code)"
            exit 1
          fi
