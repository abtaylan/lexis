name: Lexis - push reminders

on:
  schedule:
    # 09:00 ve 20:00 Türkiye saati (UTC+3, DST yok) civarı, her ikisi de 10
    # dakikada bir 6 deneme. NEDEN BÖYLE: bkz. daily-word-email.yml'deki
    # aynı yorum — GitHub Actions'ın günde 1-2 kez tetiklenen sabit dakikalı
    # cron'ları bazen SESSİZCE hiç çalıştırmadığı görüldü. Backend'de
    # already_ran_today idempotency kontrolü günde tek gönderim garantisi
    # veriyor (bkz. cron.py).
    - cron: '0,10,20,30,40,50 6 * * *'   # sabah penceresi
    - cron: '0,10,20,30,40,50 17 * * *'  # akşam penceresi
  workflow_dispatch:
    inputs:
      slot:
        description: 'morning veya evening (workflow_dispatch ile manuel tetiklerken)'
        required: true
        default: 'morning'

jobs:
  trigger-push-reminder:
    runs-on: ubuntu-latest
    steps:
      - name: Slot belirle (hangi saat penceresinde tetiklendi)
        id: slot
        run: |
          # GERÇEK ARIZA (8 Eylül 2026): sabah penceresinin (06:00-06:50 UTC
          # hedef) tetiklenmesi GitHub tarafında ~5 SAAT gecikti — cron ilk
          # kez gerçekten ateşlendi ama saat==6 tam eşleşmesi arayan eski
          # kod "Beklenmeyen saat: 10" deyip hata verdi, push HİÇ gönderilmedi
          # (bkz. cron_job_runs / Actions run #2). GitHub'ın zamanlanmış
          # workflow'ları dakikalarca değil SAATLERCE geciktirebildiği
          # kanıtlandı. Bu yüzden artık tam saat eşleşmesi yerine günü ikiye
          # bölen geniş bir pencere kullanılıyor: 00:00-11:59 UTC arası
          # tetiklenen HER şey "morning", 12:00-23:59 UTC arası tetiklenen
          # HER şey "evening" sayılır — hangi saatte gelirse gelsin
          # sınıflandırma asla başarısız olmaz. Aynı gün birden fazla
          # gönderim olmasını backend'deki already_ran_today (slot bazlı,
          # bkz. cron.py) zaten engelliyor.
          if [ -n "${{ github.event.schedule }}" ]; then
            hour=$(date -u +%H)
            if [ "$hour" -lt 12 ]; then
              echo "slot=morning" >> "$GITHUB_OUTPUT"
            else
              echo "slot=evening" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "slot=${{ github.event.inputs.slot }}" >> "$GITHUB_OUTPUT"
          fi

      - name: "POST /internal/cron/send-push-reminder-<slot>"
        run: |
          set -e
          http_code=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -X POST "${{ secrets.LEXIS_BACKEND_URL }}/internal/cron/send-push-reminder-${{ steps.slot.outputs.slot }}" \
            -H "X-Cron-Secret: ${{ secrets.LEXIS_CRON_SECRET }}")
          echo "HTTP $http_code"
          cat /tmp/response.json
          if [ "$http_code" -ge 300 ]; then
            echo "İstek başarısız (HTTP $http_code)"
            exit 1
          fi

      # Kullanıcı isteği (8 Eylül 2026) — sınav hatırlatıcısı (YDS/YÖKDİL/
      # TOEFL/IELTS vb.) günde 1 kez yeterli, bu yüzden sadece sabah
      # penceresinde tetikleniyor; backend'deki already_ran_today zaten
      # ikinci bir tetiklemeyi atlıyor ama gereksiz isteği baştan önlüyoruz.
      - name: "POST /internal/cron/send-exam-reminders (sadece sabah penceresi)"
        if: steps.slot.outputs.slot == 'morning'
        run: |
          set -e
          http_code=$(curl -s -o /tmp/response2.json -w "%{http_code}" \
            -X POST "${{ secrets.LEXIS_BACKEND_URL }}/internal/cron/send-exam-reminders" \
            -H "X-Cron-Secret: ${{ secrets.LEXIS_CRON_SECRET }}")
          echo "HTTP $http_code"
          cat /tmp/response2.json
          if [ "$http_code" -ge 300 ]; then
            echo "İstek başarısız (HTTP $http_code)"
            exit 1
          fi
