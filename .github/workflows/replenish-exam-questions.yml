name: Lexis - daily exam question replenishment

# Adaptif Ogrenme Motoru Madde 3, 2. bolum (24 Eylul 2026): periyodik
# recheck sinavlari onceki gorulen placement sorularini haric tuttugu
# icin dil+seviye onayli soru havuzu zamanla tukenebilir. Bu is esigin
# altina dusen dil+seviye kombinasyonlari icin AI ile yeni sorular uretip
# admin onay kuyruguna (status='pending') ekler
# (backend/app/services/question_replenishment_service.py).
on:
  schedule:
    # 04:00 UTC (07:00 Turkiye) civari, reassess-user-levels'tan (03:00
    # UTC) sonra -- ayni gun icinde cakismasin diye bir saat kaydirildi.
    # 10 dakikada bir 3 deneme, GitHub Actions cron tick atlamalarina
    # karsi (bkz. daily-word-email.yml). Backend already_ran_today ile
    # gunde tek calismayi garanti ediyor.
    - cron: '5,15,25 4 * * *'
  workflow_dispatch: {}

jobs:
  trigger-replenish-exam-questions:
    runs-on: ubuntu-latest
    steps:
      - name: POST /internal/cron/replenish-exam-questions
        run: |
          set -e
          http_code=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -X POST "${{ secrets.LEXIS_BACKEND_URL }}/internal/cron/replenish-exam-questions" \
            -H "X-Cron-Secret: ${{ secrets.LEXIS_CRON_SECRET }}")
          echo "HTTP $http_code"
          cat /tmp/response.json
          if [ "$http_code" -ge 300 ]; then
            echo "Istek basarisiz (HTTP $http_code)"
            exit 1
          fi
