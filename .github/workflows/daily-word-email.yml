name: Lexis - daily word email

on:
  schedule:
    # 09:00 Türkiye saati (UTC+3, DST yok) civarı, 10 dakikada bir 6 deneme
    # (06:00-06:50 UTC). NEDEN BÖYLE: GitHub Actions'ın günde tek bir sabit
    # dakikadaki (örn. 06:05) cron tick'i bazen SESSİZCE hiç çalıştırmadığı
    # görüldü (bkz. cron.py'deki already_ran_today notu, 7 Eylül 2026) —
    # schedule-reminders.yml'nin (*/5 * * * *) kanıtlanmış güvenilir
    # deseniyle aynı mantık: birden fazla deneme şansı, backend tarafında
    # idempotency (already_ran_today) ile günde tek gönderim garantisi.
    - cron: '0,10,20,30,40,50 6 * * *'
  workflow_dispatch: {}

jobs:
  trigger-daily-word-email:
    runs-on: ubuntu-latest
    steps:
      - name: POST /internal/cron/send-daily-word-email
        run: |
          set -e
          http_code=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -X POST "${{ secrets.LEXIS_BACKEND_URL }}/internal/cron/send-daily-word-email" \
            -H "X-Cron-Secret: ${{ secrets.LEXIS_CRON_SECRET }}")
          echo "HTTP $http_code"
          cat /tmp/response.json
          if [ "$http_code" -ge 300 ]; then
            echo "İstek başarısız (HTTP $http_code)"
            exit 1
          fi
